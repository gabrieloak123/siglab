spring.application.name=siglab

spring.security.user.name=admin
spring.security.user.password={noop}admin
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# SMTP (Gmail) - credenciais carregadas do ambiente (.env)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Execucao assincrona (notificacao de seguidores)
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=200
spring.task.execution.thread-name-prefix=siglab-async-
